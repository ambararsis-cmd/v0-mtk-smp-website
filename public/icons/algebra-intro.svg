<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Book base -->
  <rect x="10" y="15" width="60" height="50" rx="4" fill="#ffffff"/>
  <rect x="10" y="15" width="30" height="50" rx="4 0 0 4" fill="#e3f2fd"/>
  
  <!-- Book spine -->
  <line x1="40" y1="15" x2="40" y2="65" stroke="#90caf9" stroke-width="2"/>
  
  <!-- Math symbols -->
  <text x="25" y="45" text-anchor="middle" fill="#1565c0" font-size="18" font-weight="bold">x</text>
  <text x="55" y="45" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold">+2</text>
  
  <!-- Decoration -->
  <circle cx="20" cy="25" r="3" fill="#42a5f5"/>
  <circle cx="60" cy="25" r="3" fill="#42a5f5"/>
  <circle cx="20" cy="55" r="3" fill="#42a5f5"/>
  <circle cx="60" cy="55" r="3" fill="#42a5f5"/>
</svg>
