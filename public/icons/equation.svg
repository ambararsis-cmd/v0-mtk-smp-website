<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Balance/Scale base -->
  <rect x="35" y="55" width="10" height="15" fill="#5d4037"/>
  <rect x="20" y="68" width="40" height="6" rx="2" fill="#795548"/>
  
  <!-- Balance beam -->
  <rect x="10" y="25" width="60" height="4" rx="2" fill="#8d6e63"/>
  
  <!-- Center pivot -->
  <circle cx="40" cy="27" r="6" fill="#ffa726"/>
  
  <!-- Left pan -->
  <path d="M10 29 L5 45 L25 45 L20 29" fill="#ffcc80"/>
  <text x="15" y="42" fill="#e65100" font-size="12" font-weight="bold">2x</text>
  
  <!-- Right pan -->
  <path d="M60 29 L55 45 L75 45 L70 29" fill="#ffcc80"/>
  <text x="62" y="42" fill="#e65100" font-size="12" font-weight="bold">10</text>
  
  <!-- Chains -->
  <line x1="15" y1="29" x2="15" y2="32" stroke="#8d6e63" stroke-width="2"/>
  <line x1="65" y1="29" x2="65" y2="32" stroke="#8d6e63" stroke-width="2"/>
</svg>
