<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Graph background -->
  <rect x="10" y="10" width="60" height="60" fill="#ffebee" rx="4"/>
  
  <!-- Grid lines -->
  <line x1="10" y1="40" x2="70" y2="40" stroke="#ffcdd2" stroke-width="1"/>
  <line x1="40" y1="10" x2="40" y2="70" stroke="#ffcdd2" stroke-width="1"/>
  
  <!-- Parabola curve -->
  <path d="M15 60 Q25 45 40 25 Q55 45 65 60" stroke="#e53935" stroke-width="3" fill="none"/>
  
  <!-- Points on curve -->
  <circle cx="40" cy="25" r="4" fill="#c62828"/>
  <circle cx="22" cy="50" r="3" fill="#ef5350"/>
  <circle cx="58" cy="50" r="3" fill="#ef5350"/>
  
  <!-- Axis labels -->
  <text x="68" y="38" fill="#c62828" font-size="10" font-weight="bold">x</text>
  <text x="42" y="15" fill="#c62828" font-size="10" font-weight="bold">y</text>
  
  <!-- Formula hint -->
  <text x="40" y="75" text-anchor="middle" fill="#c62828" font-size="8">ax²+bx+c</text>
</svg>
